name: Staging Lighthouse lab audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/staging-lighthouse.yml'
      - 'site/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install approved image bundle
        run: |
          unzip -j -o -q Ciao_Bella_Approved_Staging_Images.zip -d site/assets
          test -f site/assets/3635.webp
      - name: Verify locally preserved original Holiday Parties artwork
        run: |
          test -s site/assets/holiday-party-original.jpg
          echo "Using client-supplied original artwork from staging repository"
      - name: Start local staging server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory site > /tmp/ciaobella-local.log 2>&1 &
          sleep 2
      - name: Audit homepage with Lighthouse mobile profile
        run: |
          mkdir -p audit
          npx --yes lighthouse@12 http://127.0.0.1:8765/index.html --only-categories=performance,accessibility,seo --form-factor=mobile --screenEmulation.mobile=true --throttling-method=simulate --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path=audit/lighthouse-mobile.json --quiet
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('audit/lighthouse-mobile.json','utf8'));
          const c=x.categories;
          const a=x.audits;
          const result={
            context:'Local GitHub runner Lighthouse mobile lab (NOT production or field CWV)',
            performance:Math.round(c.performance.score*100),
            accessibility:Math.round(c.accessibility.score*100),
            seo:Math.round(c.seo.score*100),
            labLCPms:a['largest-contentful-paint']?.numericValue??null,
            labCLS:a['cumulative-layout-shift']?.numericValue??null,
            labTBTms:a['total-blocking-time']?.numericValue??null,
            INP:'Not measurable with a single Lighthouse lab load; requires field instrumentation'
          };
          
          const lcp=a['largest-contentful-paint-element']?.details?.items?.[0]||null;
          const perfDiagnostics=Object.keys(a).filter(k=>/lcp|render-blocking|font-display/i.test(k)).map(k=>({key:k,score:a[k]?.score,displayValue:a[k]?.displayValue,details:a[k]?.details?.items?.[0]?.node?.snippet||null}));
          console.log('LCP ELEMENT '+JSON.stringify(lcp).slice(0,2400));
          console.log('LCP DIAGNOSTICS '+JSON.stringify(perfDiagnostics).slice(0,4400));
          console.log('LCP BREAKDOWN '+JSON.stringify(a['lcp-breakdown-insight']?.details?.items??[]).slice(0,5000));
          console.log('RENDER BLOCKERS '+JSON.stringify(a['render-blocking-insight']?.details?.items??[]).slice(0,5000));
          console.log('LIGHTHOUSE RESULTS '+JSON.stringify(result,null,2));
          fs.writeFileSync('audit/lighthouse-summary.json',JSON.stringify(result,null,2));
          NODE
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ciao-bella-lighthouse-mobile
          path: audit/
          if-no-files-found: warn
