name: Staging mobile and interaction audit
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tests/**'
      - '.github/workflows/staging-audit.yml'
      - 'Ciao_Bella_Approved_Staging_Images.zip'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract approved Ciao Bella imagery
        run: |
          test -f Ciao_Bella_Approved_Staging_Images.zip
          unzip -j -o -q Ciao_Bella_Approved_Staging_Images.zip -d site/assets
          test -f site/assets/3640.png
          test -f site/assets/3635.webp
      - name: Verify locally preserved original Holiday Parties artwork
        run: |
          test -s site/assets/holiday-party-original.jpg
          echo "Using client-supplied original artwork from staging repository"
      - name: Install browser test library
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.0
      - name: Launch local staging server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory site > /tmp/ciao-staging-http.log 2>&1 &
          sleep 2
      - name: Verify responsive behavior, accessibility hooks, and images
        run: node tests/staging-browser-audit.mjs
      - name: Save audit JSON and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ciao-bella-responsive-audit
          path: audit/
          if-no-files-found: warn
